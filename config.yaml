# Paths are relative to this file unless absolute.
paths:
  input: input
  output: output
  source: null

processing:
  reanalyze: false

# One fixed webcam rectangle is used for the entire recording.
webcam:
  # false uses the whole source frame instead of a webcam rectangle.
  enabled: true
  auto: true
  samples: 24
  # Used when auto is false.
  x: 976
  y: 540
  width: 304
  height: 180

# Remove intervals where the face is not detected.
face:
  enabled: true
  missing_tolerance_seconds: 0.0

# Remove speech independently from the face filter.
speech:
  enabled: false
  # both: voice and mouth motion; speech: voice only; mouth: mouth motion only.
  method: both
  # true keeps detected speech; false removes it.
  invert: false

# Crop the fixed webcam rectangle to an aspect ratio without stretching.
aspect:
  enabled: true
  ratio: '16:10'

# Remove the audio track from exported files; speech analysis is unaffected.
mute:
  enabled: false

# Shared analysis parameters.
analysis:
  sample_fps: 5
  audio_sample_rate: 16000
  audio_frame_ms: 30
  vad_aggressiveness: 2
  lip_motion_threshold: 2.8
  mouth_motion_ratio: 0.5
  speech_ratio: 0.2
  window_seconds: 0.6
  speech_padding_seconds: 0.35

# Detect probable smoking independently from face and speech filtering.
smoking:
  enabled: true
  # true blurs detected object regions; false cuts smoking intervals.
  blur: true
  blur_sigma: 15.0
  # More conservative: only blur detections near a detected mouth.
  blur_near_mouth: true
  blur_margin_pixels: 6
  # Maximum time on either side of a confirmed detection.
  blur_hold_seconds: 0.35
  model: models/smoking_detector.onnx
  backend: auto
  device_id: 0
  sample_fps: 2.0
  input_size: 640
  confidence: 0.35
  min_hits: 2
  max_gap_seconds: 2.5
  padding_before_seconds: 1.0
  padding_after_seconds: 2.0
  merge_gap_seconds: 4.0
  threads: 2

output:
  # true: separate numbered episodes; false: one concatenated video.
  split_episodes: true
  video_codec: libx264
  preset: veryfast
  crf: 23
  audio_codec: aac
  audio_bitrate: 160k
  # Joining gaps can include previously filtered audio/video.
  join_gap_seconds: 0.0
  # 0 keeps all non-empty episodes.
  min_segment_seconds: 0.0

logging:
  console_level: INFO
  file_level: DEBUG
